name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Gradle Wrapper and Build APK
      run: |
        # إنشاء ملف التوقيع في المكان الصحيح داخل مجلد app
        keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 || true
        
        # توليد الجرادل بالإصدار المطلوب للمشروع
        gradle wrapper --gradle-version 9.3.1
        
        # منح صلاحية التنفيذ
        chmod +x gradlew
        
        # بناء التطبيق واستخراج ملف الـ APK
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tas3ira-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
